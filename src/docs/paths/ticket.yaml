/api/tickets:
  get:
    summary: Get all tickets
    tags: [Tickets]
    parameters:
      - in: query
        name: seating_id
        schema:
          type: integer
        description: Filter by seating id
      - in: query
        name: event_id
        schema:
          type: integer
        description: Filter by event id
    responses:
      "200":
        description: Success
  post:
    summary: Create ticket
    tags: [Tickets]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ticket"
    responses:
      "201":
        description: Created
      "400":
        description: Invalid seating_id or event_id, or seating does not belong to the venue where the event takes place

/api/tickets/bulk:
  post:
    summary: Bulk create tickets
    tags: [Tickets]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Ticket"
    responses:
      "201":
        description: Created
      "400":
        description: Invalid seating_id or event_id, or seating does not belong to the venue where the event takes place, for one or more items

/api/tickets/{id}:
  get:
    summary: Get ticket by id
    tags: [Tickets]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Success
      "404":
        description: Not found
  put:
    summary: Update ticket
    tags: [Tickets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ticket"
    responses:
      "200":
        description: Updated
      "400":
        description: Invalid seating_id or event_id, or seating does not belong to the venue where the event takes place
      "404":
        description: Not found
  delete:
    summary: Delete ticket
    tags: [Tickets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Deleted
      "400":
        description: Cannot delete a ticket that already has sold tickets
      "404":
        description: Not found

components:
  schemas:
    Ticket:
      type: object
      required:
        - price
        - seating_id
        - event_id
      properties:
        id:
          type: integer
          example: 1
        price:
          type: integer
          example: 50
        seating_id:
          type: integer
          example: 3
        event_id:
          type: integer
          example: 2