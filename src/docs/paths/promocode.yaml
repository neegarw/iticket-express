/api/promocodes:
  get:
    summary: Get all promo codes
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Success
  post:
    summary: Create promo code
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromoCode"
    responses:
      "201":
        description: Created

/api/promocodes/bulk:
  post:
    summary: Bulk create promo codes
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PromoCode"
    responses:
      "201":
        description: Created

/api/promocodes/validate:
  post:
    summary: Validate a promo code
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - event_id
            properties:
              code:
                type: string
                example: SUMMER25
              event_id:
                type: integer
                example: 4
    responses:
      "200":
        description: Valid promo code, returns discount percentage
      "400":
        description: Promo code expired
      "404":
        description: Promo code not found

/api/promocodes/{id}:
  get:
    summary: Get promo code by id
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Success
      "404":
        description: Not found
  put:
    summary: Update promo code
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromoCode"
    responses:
      "200":
        description: Updated
      "404":
        description: Not found
  delete:
    summary: Delete promo code
    tags: [PromoCodes]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Deleted
      "404":
        description: Not found