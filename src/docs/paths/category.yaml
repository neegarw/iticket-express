/api/categories:
  get:
    summary: Get all categories
    tags: [Categories]
    parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search by category name (AZ, RU, EN)

      - in: query
        name: sortBy
        schema:
          type: string
          enum:
            - id
            - name_az
            - name_ru
            - name_en
            - created_at

      - in: query
        name: order
        schema:
          type: string
          enum:
            - ASC
            - DESC

      - in: query
        name: page
        schema:
          type: integer
          default: 1

      - in: query
        name: limit
        schema:
          type: integer
          default: 20

    responses:
      "200":
        description: Success

  post:
    summary: Create category
    tags: [Categories]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Category"
    responses:
      "201":
        description: Category created
      "400":
        description: Validation error

/api/categories/bulk:
  post:
    summary: Bulk create categories
    tags: [Categories]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Category"
    responses:
      "201":
        description: Categories created
      "400":
        description: Invalid request body

/api/categories/{id}:
  get:
    summary: Get category by id
    tags: [Categories]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer

    responses:
      "200":
        description: Success
      "404":
        description: Category not found

  put:
    summary: Update category
    tags: [Categories]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Category"

    responses:
      "200":
        description: Category updated
      "404":
        description: Category not found

  delete:
    summary: Delete category
    tags: [Categories]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer

    responses:
      "200":
        description: Category deleted
      "404":
        description: Category not found