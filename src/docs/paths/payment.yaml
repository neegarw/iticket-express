/api/payments:
  post:
    summary: Create payment (pay for an order)
    tags: [Payments]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order_id
              - method
            properties:
              order_id:
                type: integer
                example: 5
              method:
                type: string
                enum: [card, cash, online]
                example: card
    responses:
      "201":
        description: Payment successful, order confirmed
      "400":
        description: Order cancelled or payment already exists
      "404":
        description: Order not found
  get:
    summary: Get all payments (admin)
    tags: [Payments]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Success

/api/payments/order/{order_id}:
  get:
    summary: Get payment by order id
    tags: [Payments]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Success
      "404":
        description: Payment not found